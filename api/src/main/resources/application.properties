quarkus.application.name=sislogica-api
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP Configuration
quarkus.http.port=8080

# Database Configuration (PostgreSQL)
quarkus.datasource.db-kind=postgresql

# Em desenvolvimento, consome variaveis do arquivo .env
%dev.quarkus.datasource.username=${DB_USER}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Em producao, consome variaveis de ambiente
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Em testes, o Quarkus Dev Services (Testcontainers) gerencia o banco PostgreSQL automaticamente
# Sem URL fixa, garantindo execucao no Docker Desktop e no GitHub Actions CI!
%test.quarkus.datasource.devservices.enabled=true

# Hibernate ORM (O esquema deve ser gerado EXCLUSIVAMENTE por migracoes Flyway)
quarkus.hibernate-orm.database.generation=none

# Flyway Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# OpenAPI & Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
